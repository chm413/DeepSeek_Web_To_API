name: Quality Gates

on:
  pull_request:
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.0"
  NODE_VERSION: "24"
  GOLANGCI_LINT_VERSION: "v2.11.4"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  lint-and-refactor:
    name: Lint and Refactor Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Go toolchain
        env:
          REQUIRED_GO_VERSION: ${{ env.GO_VERSION }}
        run: bash ./scripts/ci/select-go-toolchain.sh

      - name: Go Format and Lint Gates
        env:
          GOLANGCI_LINT_VERSION: ${{ env.GOLANGCI_LINT_VERSION }}
        run: bash ./scripts/lint.sh

      - name: Refactor Line Gate
        run: bash ./tests/scripts/check-refactor-line-gate.sh

  go-unit:
    name: Go Unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Go toolchain
        env:
          REQUIRED_GO_VERSION: ${{ env.GO_VERSION }}
        run: bash ./scripts/ci/select-go-toolchain.sh

      - name: Go Unit Gate
        run: bash ./tests/scripts/run-unit-go.sh

  unit-all:
    name: Unit Gates (Go + Node)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Go toolchain
        env:
          REQUIRED_GO_VERSION: ${{ env.GO_VERSION }}
        run: bash ./scripts/ci/select-go-toolchain.sh

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Unit Gates (Go + Node)
        run: bash ./tests/scripts/run-unit-all.sh

  webui-build:
    name: WebUI Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: WebUI Build Gate
        run: |
          npm ci --prefix webui --prefer-offline --no-audit
          npm run build --prefix webui

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build runtime image
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
          DOCKER_BUILD_SUMMARY: "false"
        with:
          context: .
          file: ./Dockerfile
          target: runtime-from-source
          push: false
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  cross-build:
    name: Release Target Cross-Build
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Go toolchain
        env:
          REQUIRED_GO_VERSION: ${{ env.GO_VERSION }}
        run: bash ./scripts/ci/select-go-toolchain.sh

      - name: Cross-Build Release Targets
        env:
          CROSS_BUILD_JOBS: "1"
        run: bash ./tests/scripts/check-cross-build.sh
