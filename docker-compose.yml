services:
  legacy-config-migration:
    image: ghcr.io/chm413/deepseek-web-to-api:latest
    restart: "no"
    # The main service runs as this image user as well. Do not add env_file:
    # this one-shot bridge only needs the two paths below, not application secrets.
    user: "deepseek-web-to-api"
    entrypoint: ["/usr/local/bin/deepseek-web-to-api-migrate-legacy-config"]
    environment:
      - DEEPSEEK_WEB_TO_API_LEGACY_CONFIG_SOURCE=/legacy/config.json
      - DEEPSEEK_WEB_TO_API_CONFIG_PATH=/app/data/config.json
    volumes:
      # Kept isolated to this short-lived migration container. The application
      # service below never receives a mount of the project root.
      - ./:/legacy:ro
      - ./data:/app/data

  deepseek-web-to-api:
    image: ghcr.io/chm413/deepseek-web-to-api:latest
    container_name: deepseek-web-to-api
    restart: always
    depends_on:
      legacy-config-migration:
        condition: service_completed_successfully
    env_file:
      - .env
    ports:
      # Host port is configurable via DEEPSEEK_WEB_TO_API_HOST_PORT; container listens on 5001.
      - "${DEEPSEEK_WEB_TO_API_HOST_BIND_ADDR:-127.0.0.1}:${DEEPSEEK_WEB_TO_API_HOST_PORT:-6011}:5001"
    volumes:
      - ./data:/app/data   # config, SQLite, cache, logs, Xray core, and verified self-update releases
    environment:
      - TZ=Asia/Shanghai
      - DEEPSEEK_WEB_TO_API_BIND_ADDR=0.0.0.0
      - DEEPSEEK_WEB_TO_API_ENV_WRITEBACK=true
      - DEEPSEEK_WEB_TO_API_CONFIG_PATH=/app/data/config.json
      - DEEPSEEK_WEB_TO_API_ACCOUNTS_SQLITE_PATH=/app/data/accounts.sqlite
      # The image entrypoint launches a checksum-verified version from this
      # persistent directory, otherwise it falls back to the image binary.
      - DEEPSEEK_WEB_TO_API_SELF_UPDATE_ROOT=/app/data/self-update
    healthcheck:
      test: ["CMD", "/usr/local/bin/busybox", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5001/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
